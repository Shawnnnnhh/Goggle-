<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-div">
            <img src="icons8-google.svg" alt="Google logo">
                <p id="sign-in">Sign in</p>
                <p id="continue">Use your Google Account</p>
        </div>
        <div class="right-div"> 
            <input type="text" placeholder="Email or phone">
            <p id="forgot_password" style="color: #a8c7fa;">Forgot Password?</p>
            <p>Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more about using Guest mode</a></p>
        </div>
    </div>
</body>
</html>
